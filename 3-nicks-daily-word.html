<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Nick's Daily Word</title>
<style>
:root{
  --bg:#0b162a; --panel:#141f36; --tile:#1b2740; --tile-border:#33415e;
  --text:#f2f4f8; --dim:#8b98b4; --accent:#e8692a;
  --correct:#538d4e; --present:#c9b458; --absent:#3a3f4d;
  --key:#2a3854; --key-text:#e8ecf4;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  display:flex; flex-direction:column; align-items:center; min-height:100vh;
  touch-action:manipulation; user-select:none; -webkit-user-select:none;
}
header{
  width:100%; max-width:520px; padding:12px 12px 8px; text-align:center;
  border-bottom:1px solid #22304e; position:relative;
}
h1{
  margin:0; font-size:clamp(22px,6vw,30px); letter-spacing:1px;
  color:var(--text);
}
h1 .bear{color:var(--accent);}
#backlink{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);left:14px;color:var(--dim);text-decoration:none;font-size:13px;font-weight:600;z-index:50;}
.sub{color:var(--dim); font-size:13px; margin-top:2px; min-height:16px;}
.hbtns{display:flex; gap:8px; justify-content:center; margin-top:8px;}
.hbtns button{
  background:var(--panel); color:var(--dim); border:1px solid #2c3a58; border-radius:8px;
  font-size:12px; padding:6px 9px; cursor:pointer;
}
.hbtns button.active{color:var(--accent); border-color:var(--accent);}
#board{
  display:grid; grid-template-rows:repeat(6,1fr); gap:5px;
  margin:14px 0 10px; width:min(92vw,340px);
}
.row{display:grid; grid-template-columns:repeat(5,1fr); gap:5px;}
.tile{
  width:100%; aspect-ratio:1; display:flex; align-items:center; justify-content:center;
  background:var(--tile); border:2px solid var(--tile-border); border-radius:6px;
  font-size:clamp(24px,8vw,34px); font-weight:700; text-transform:uppercase;
  transition:background .18s, border-color .18s, transform .1s;
}
.tile.filled{border-color:#54679a; transform:scale(1.04);}
.tile.filled:not(.flip){animation:pop .12s ease-out;}
@keyframes pop{0%{transform:scale(.85);}100%{transform:scale(1.04);}}
.tile.flip{animation:flip .32s ease-in-out;}
@keyframes flip{0%{transform:rotateX(0);}50%{transform:rotateX(90deg);}100%{transform:rotateX(0);}}
.tile.correct{background:var(--correct); border-color:var(--correct);}
.tile.present{background:var(--present); border-color:var(--present);}
.tile.absent{background:var(--absent); border-color:var(--absent);}
.row.shake{animation:shake .4s;}
@keyframes shake{0%,100%{transform:translateX(0);}20%{transform:translateX(-8px);}40%{transform:translateX(8px);}60%{transform:translateX(-6px);}80%{transform:translateX(6px);}}
#keyboard{width:min(98vw,500px); padding:0 4px calc(8px + env(safe-area-inset-bottom));}
.krow{display:flex; justify-content:center; gap:5px; margin-bottom:6px;}
.key{
  flex:1 1 0; min-width:0; padding:0; height:52px; border:none; border-radius:6px;
  background:var(--key); color:var(--key-text); font-size:15px; font-weight:700;
  text-transform:uppercase; cursor:pointer; font-family:inherit;
}
.key:active{filter:brightness(1.3);}
.key.wide{flex:1.5; font-size:11px; letter-spacing:0;}
.key.correct{background:var(--correct);} .key.present{background:var(--present);} .key.absent{background:var(--absent); color:#aab;}
#toast{
  position:fixed; top:64px; left:50%; transform:translateX(-50%);
  background:#eef1f7; color:#111; padding:9px 16px; border-radius:8px;
  font-weight:600; font-size:14px; opacity:0; transition:opacity .25s; pointer-events:none; z-index:30;
}
#toast.show{opacity:1;}
#modal{
  position:fixed; inset:0; background:rgba(4,8,18,.75); display:flex;
  align-items:center; justify-content:center; z-index:40; padding:18px;
}
#modal.hidden{display:none;}
.card{
  background:var(--panel); border:1px solid #2c3a58; border-radius:14px;
  padding:20px 22px; width:min(92vw,360px); max-height:86vh; overflow:auto; text-align:center;
}
.card h2{margin:0 0 4px; font-size:20px;}
.card .note{color:var(--dim); font-size:12px; margin-bottom:12px;}
.stat-row{display:flex; justify-content:space-around; margin:12px 0;}
.stat{min-width:56px;}
.stat .num{font-size:26px; font-weight:700;}
.stat .lbl{font-size:11px; color:var(--dim); margin-top:2px;}
.dist{margin:10px 0 16px; text-align:left;}
.dist-row{display:flex; align-items:center; gap:8px; margin:4px 0; font-size:13px;}
.dist-bar{background:#33415e; min-width:22px; height:18px; border-radius:3px; text-align:right; padding-right:5px; font-size:11px; line-height:18px; color:#fff;}
.dist-bar.hot{background:var(--accent);}
.big-btn{
  background:var(--accent); color:#fff; border:none; border-radius:10px;
  font-size:16px; font-weight:700; padding:12px 18px; width:100%; cursor:pointer; margin-top:6px;
}
.ghost-btn{
  background:transparent; color:var(--dim); border:1px solid #2c3a58; border-radius:10px;
  font-size:13px; padding:10px 14px; width:100%; cursor:pointer; margin-top:8px;
}
.reveal-word{color:var(--accent); font-weight:800; letter-spacing:3px;}
.footer-note{color:#55648a; font-size:11px; margin:8px 0 0; text-align:center;}
</style>
</head>
<body>
<header>
  <a id="backlink" href="./">&#8592; Arcade</a>
  <h1>Nick's <span class="bear">Daily</span> Word</h1>
  <div class="sub" id="modeLine"></div>
  <div class="hbtns">
    <button id="practiceBtn">Practice</button>
    <button id="statsBtn">Stats</button>
  </div>
</header>
<div id="toast"></div>
<div id="board"></div>
<div id="keyboard"></div>
<p class="footer-note">a new word every day - bears colors, wordle rules</p>

<div id="modal" class="hidden">
  <div class="card">
    <h2 id="modalTitle">Stats</h2>
    <div class="note">daily games only - practice is just for fun</div>
    <div class="stat-row">
      <div class="stat"><div class="num" id="sPlayed">0</div><div class="lbl">Played</div></div>
      <div class="stat"><div class="num" id="sWin">0</div><div class="lbl">Win %</div></div>
      <div class="stat"><div class="num" id="sStreak">0</div><div class="lbl">Streak</div></div>
      <div class="stat"><div class="num" id="sMax">0</div><div class="lbl">Best</div></div>
    </div>
    <div class="dist" id="sDist"></div>
    <div id="endMsg" style="margin:8px 0 4px; font-size:15px;"></div>
    <button class="big-btn" id="shareBtn">Share Result</button>
    <button class="ghost-btn" id="practiceModalBtn">Keep playing (practice)</button>
    <button class="ghost-btn" id="closeModal">Close</button>
  </div>
</div>

var ANSWER_SET = {};
ANSWERS.forEach(function(w){ ANSWER_SET[w] = true; });
// guesses are validated live against the open dictionary (Wiktionary), never a baked-in list
var DICT_KEY = "ndw_dict_v1";
var DICT_CACHE = {};
try { DICT_CACHE = JSON.parse(localStorage.getItem(DICT_KEY)) || {}; } catch(e){ DICT_CACHE = {}; }
function dictSave(){ try { localStorage.setItem(DICT_KEY, JSON.stringify(DICT_CACHE)); } catch(e){} }
async function dictionaryCheck(word){
  var key = word.toLowerCase();
  if (key in DICT_CACHE) return { ok: true, valid: DICT_CACHE[key] };
  var sources = [
    "https://en.wiktionary.org/api/rest_v1/page/definition/",
    "https://api.dictionaryapi.dev/api/v2/entries/en/"
  ];
  for (var s = 0; s < sources.length; s++){
    var ctl = new AbortController();
    var timer = setTimeout(function(){ ctl.abort(); }, 8000);
    try {
      var r = await fetch(sources[s] + encodeURIComponent(key), { signal: ctl.signal });
      clearTimeout(timer);
      if (r.status === 200){ DICT_CACHE[key] = true; dictSave(); return { ok: true, valid: true }; }
      if (r.status === 404){ DICT_CACHE[key] = false; dictSave(); return { ok: true, valid: false }; }
    } catch(e){ clearTimeout(timer); }
  }
  return { ok: false, valid: false };
}

function dayIndex(d){
  return Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 86400000);
}
function dailyWord(idx){
  var N = ANSWERS.length;
  var cycle = Math.floor(idx / N);
  var within = idx % N;
  var salt = ((cycle * 2654435761) >>> 0) % N;
  return ANSWERS[(within * 541 + salt) % N];
}
function practiceWord(rand){
  var r = (typeof rand === "function") ? rand() : Math.random();
  return ANSWERS[Math.floor(r * ANSWERS.length) % ANSWERS.length];
}

function evaluate(guess, answer){
  var res = ["absent","absent","absent","absent","absent"];
  var counts = {};
  for (var i=0;i<5;i++){ var c = answer[i]; counts[c] = (counts[c]||0)+1; }
  for (i=0;i<5;i++){ if (guess[i]===answer[i]){ res[i]="correct"; counts[guess[i]]--; } }
  for (i=0;i<5;i++){ if (res[i]!=="correct" && counts[guess[i]]>0){ res[i]="present"; counts[guess[i]]--; } }
  return res;
}
function emptyStats(){ return {played:0, wins:0, streak:0, maxStreak:0, dist:[0,0,0,0,0,0]}; }
function recordResult(stats, won, guessCount){
  stats.played++;
  if (won){
    stats.wins++;
    stats.streak++;
    if (stats.streak > stats.maxStreak) stats.maxStreak = stats.streak;
    if (guessCount>=1 && guessCount<=6) stats.dist[guessCount-1]++;
  } else {
    stats.streak = 0;
  }
  return stats;
}
function emojiGrid(resultsRows){
  var map = {correct:"\u{1F7E9}", present:"\u{1F7E8}", absent:"\u2B1B"};
  return resultsRows.map(function(row){
    return row.map(function(r){ return map[r]; }).join("");
  }).join("\n");
}

if (typeof document !== "undefined") (function(){
  var ROWS = 6, COLS = 5;
  var LS_STATS = "ndw_stats_v1", LS_DAILY = "ndw_daily_v1", LS_PRACT = "ndw_practice_v1";

  var board = document.getElementById("board");
  var keyboard = document.getElementById("keyboard");
  var toastEl = document.getElementById("toast");
  var modeLine = document.getElementById("modeLine");
  var practiceBtn = document.getElementById("practiceBtn");
  var statsBtn = document.getElementById("statsBtn");
  var modal = document.getElementById("modal");

  var todayIdx = dayIndex(new Date());
  document.getElementById("dayNum") && 0;

  var game = null;   // {mode, answer, guesses:[], results:[], status, current}
  var stats = loadJSON(LS_STATS, emptyStats());

  function loadJSON(k, fallback){
    try { var v = JSON.parse(localStorage.getItem(k)); return v || fallback; }
    catch(e){ return fallback; }
  }
  function saveJSON(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }

  function newDaily(){
    var saved = loadJSON(LS_DAILY, null);
    if (saved && saved.day === todayIdx){ saved.mode = "daily"; return saved; }
    return {mode:"daily", day:todayIdx, answer:dailyWord(todayIdx), guesses:[], results:[], status:"playing", current:""};
  }
  function newPractice(){
    return {mode:"practice", answer:practiceWord(), guesses:[], results:[], status:"playing", current:""};
  }
  function saveGame(){
    if (game.mode === "daily") saveJSON(LS_DAILY, game); else saveJSON(LS_PRACT, game);
  }

  // ---- board rendering ----
  var tiles = [];
  function buildBoard(){
    board.innerHTML = ""; tiles = [];
    for (var r=0;r<ROWS;r++){
      var row = document.createElement("div"); row.className = "row";
      var trow = [];
      for (var c=0;c<COLS;c++){
        var t = document.createElement("div"); t.className = "tile";
        row.appendChild(t); trow.push(t);
      }
      board.appendChild(row); tiles.push(trow);
    }
  }
  function paint(){
    for (var r=0;r<ROWS;r++){
      for (var c=0;c<COLS;c++){
        var t = tiles[r][c];
        t.className = "tile"; t.textContent = "";
        if (r < game.guesses.length){
          t.textContent = game.guesses[r][c];
          t.classList.add(game.results[r][c]);
        } else if (r === game.guesses.length && game.status === "playing"){
          var ch = game.current[c];
          if (ch){ t.textContent = ch; t.classList.add("filled"); }
        }
      }
    }
  }
  function revealRow(rowIdx){
    var res = game.results[rowIdx], guess = game.guesses[rowIdx];
    for (var c=0;c<COLS;c++){
      (function(c){
        var t = tiles[rowIdx][c];
        setTimeout(function(){ t.className = "tile flip"; }, c*170);
        setTimeout(function(){ t.className = "tile flip " + res[c]; }, c*170 + 160);
        setTimeout(function(){ updateKey(guess[c], res[c]); }, c*170 + 170);
      })(c);
    }
  }

  // ---- keyboard ----
  var keyEls = {};
  var keyState = {};
  var LAYOUT = ["QWERTYUIOP","ASDFGHJKL","ENTERZXCVBNM\u232B"];
  function buildKeyboard(){
    keyboard.innerHTML = ""; keyEls = {};
    LAYOUT.forEach(function(rowDef){
      var row = document.createElement("div"); row.className = "krow";
      for (var i=0;i<rowDef.length;i++){
        var label;
        if (rowDef.substr(i,5) === "ENTER"){ label = "ENTER"; i += 4; }
        else if (rowDef[i] === "\u232B"){ label = "\u232B"; }
        else label = rowDef[i];
        var k = document.createElement("button");
        k.className = "key" + (label.length > 1 ? " wide" : "");
        k.textContent = label === "\u232B" ? "\u232B" : label;
        k.setAttribute("data-key", label);
        k.addEventListener("click", function(){ press(this.getAttribute("data-key")); });
        row.appendChild(k);
        keyEls[label] = k;
      }
      keyboard.appendChild(row);
    });
  }
  var RANK = {absent:1, present:2, correct:3};
  function updateKey(ch, res){
    var prev = keyState[ch];
    if (!prev || RANK[res] > RANK[prev]){
      keyState[ch] = res;
      var k = keyEls[ch.toUpperCase()];
      if (k){ k.classList.remove("absent","present","correct"); k.classList.add(res); }
    }
  }
  function resetKeyColors(){
    keyState = {};
    Object.keys(keyEls).forEach(function(k){ keyEls[k].classList.remove("absent","present","correct"); });
  }

  // ---- toast ----
  var toastTimer = null;
  function toast(msg, ms){
    toastEl.textContent = msg; toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove("show"); }, ms || 1600);
  }

  // ---- gameplay ----
  var revealing = false;
  function press(key){
    if (game.status !== "playing" || revealing) return;
    if (key === "ENTER"){ submit(); return; }
    if (key === "\u232B" || key === "BACKSPACE"){
      game.current = game.current.slice(0,-1); paint(); saveGame(); return;
    }
    if (/^[A-Z]$/.test(key) && game.current.length < COLS){
      game.current += key.toLowerCase(); paint(); saveGame();
    }
  }
  function shakeRow(){
    var row = board.children[game.guesses.length];
    row.classList.add("shake");
    setTimeout(function(){ row.classList.remove("shake"); }, 450);
  }
  function submit(){
    if (game.current.length < COLS){ toast("Not enough letters"); shakeRow(); return; }
    var guess = game.current;
    revealing = true;
    toast("checking the dictionary...");
    dictionaryCheck(guess).then(function(res){
      if (!res.ok){ revealing = false; toast("Dictionary unreachable - try again"); return; }
      if (!res.valid){ revealing = false; toast("Not in word list"); shakeRow(); return; }
      acceptGuess(guess);
    });
  }
  function acceptGuess(guess){
    var res = evaluate(guess, game.answer);
    game.guesses.push(guess); game.results.push(res); game.current = "";
    setTimeout(function(){ revealing = false; }, 5*170 + 200);
    revealRow(game.guesses.length - 1);
    if (guess === game.answer){
      game.status = "won";
      finish(true);
    } else if (game.guesses.length >= ROWS){
      game.status = "lost";
      finish(false);
    }
    saveGame();
  }
  function finish(won){
    if (game.mode === "daily"){
      recordResult(stats, won, game.guesses.length);
      saveJSON(LS_STATS, stats);
    }
    setTimeout(function(){
      if (won){
        var cheers = ["Genius!","Magnificent!","Impressive!","Splendid!","Great!","Phew!"];
        toast(cheers[Math.min(game.guesses.length-1,5)], 2200);
      } else {
        toast("It was " + game.answer.toUpperCase(), 2600);
      }
      setTimeout(showStats, won ? 1800 : 2200);
    }, 5*170 + 350);
  }

  // ---- modal / stats ----
  function showStats(){
    document.getElementById("sPlayed").textContent = stats.played;
    document.getElementById("sWin").textContent = stats.played ? Math.round(100*stats.wins/stats.played) : 0;
    document.getElementById("sStreak").textContent = stats.streak;
    document.getElementById("sMax").textContent = stats.maxStreak;
    var distEl = document.getElementById("sDist"); distEl.innerHTML = "";
    var max = Math.max.apply(null, stats.dist.concat([1]));
    var lastWin = (game.mode==="daily" && game.status==="won") ? game.guesses.length : -1;
    for (var i=0;i<6;i++){
      var row = document.createElement("div"); row.className = "dist-row";
      var barW = Math.max(8, Math.round(100*stats.dist[i]/max));
      row.innerHTML = "<span>"+(i+1)+"</span>";
      var bar = document.createElement("div");
      bar.className = "dist-bar" + (i+1 === lastWin ? " hot" : "");
      bar.style.width = barW + "%";
      bar.textContent = stats.dist[i];
      row.appendChild(bar); distEl.appendChild(row);
    }
    var endMsg = document.getElementById("endMsg");
    if (game.status === "won") endMsg.innerHTML = "Solved in " + game.guesses.length + "/6" + (game.mode==="practice" ? " (practice)" : "");
    else if (game.status === "lost") endMsg.innerHTML = "The word was <span class='reveal-word'>" + game.answer.toUpperCase() + "</span>";
    else endMsg.textContent = "";
    document.getElementById("shareBtn").style.display = game.status === "playing" ? "none" : "block";
    modal.classList.remove("hidden");
  }
  document.getElementById("closeModal").addEventListener("click", function(){ modal.classList.add("hidden"); });
  document.getElementById("practiceModalBtn").addEventListener("click", function(){
    modal.classList.add("hidden");
    if (game.mode !== "practice"){ loadMode("practice"); practiceBtn.textContent = "Daily"; }
    else { game = newPractice(); resetKeyColors(); paint(); setModeLine(); saveGame(); }
  });
  modal.addEventListener("click", function(e){ if (e.target === modal) modal.classList.add("hidden"); });

  document.getElementById("shareBtn").addEventListener("click", function(){
    var n = game.status === "won" ? game.guesses.length : "X";
    var head = game.mode === "daily"
      ? "Nick's Daily Word #" + (todayIdx - 20500) + " " + n + "/6"
      : "Nick's Daily Word (practice) " + n + "/6";
    var text = head + "\n" + emojiGrid(game.results);
    function done(){ toast("Copied to clipboard"); }
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(done, function(){ fallbackCopy(text); done(); });
    } else { fallbackCopy(text); done(); }
  });
  function fallbackCopy(text){
    var ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); } catch(e){}
    document.body.removeChild(ta);
  }

  // ---- mode switching ----
  function setModeLine(){
    if (game.mode === "daily"){
      modeLine.textContent = "Daily #" + (todayIdx - 20500) + " - " + new Date().toLocaleDateString(undefined, {month:"short", day:"numeric", year:"numeric"});
    } else {
      modeLine.textContent = "Practice round - stats not affected";
    }
    practiceBtn.classList.toggle("active", game.mode === "practice");
  }
  function loadMode(mode){
    game = mode === "daily" ? newDaily() : loadJSON(LS_PRACT, null) || newPractice();
    if (mode === "practice" && game.mode !== "practice") game = newPractice();
    if (mode === "practice" && game.status !== "playing") game = newPractice();
    resetKeyColors();
    game.results.forEach(function(row, r){
      row.forEach(function(res, c){ updateKey(game.guesses[r][c], res); });
    });
    paint(); setModeLine(); saveGame();
  }
  practiceBtn.addEventListener("click", function(){
    if (game.mode === "daily"){ loadMode("practice"); }
    else { loadMode("daily"); }
    practiceBtn.textContent = game.mode === "daily" ? "Practice" : "Daily";
  });
  statsBtn.addEventListener("click", showStats);

  // physical keyboard
  document.addEventListener("keydown", function(e){
    if (!modal.classList.contains("hidden")) return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var k = e.key.toUpperCase();
    if (k === "ENTER" || k === "BACKSPACE" || /^[A-Z]$/.test(k)){ press(k); e.preventDefault(); }
  });

  // ---- boot ----
  buildBoard(); buildKeyboard();
  loadMode("daily");
  if (stats.played === 0 && game.guesses.length === 0){
    setTimeout(function(){ toast("Guess the 5-letter word - 6 tries"); }, 400);
  }
})();
</script>
</body>
</html>
